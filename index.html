<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values, which is what keeps the tab bar off the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Workout checklist, progressive overload tracking, and daily protein." />

    <title>Justin's Fitness Journey</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <!-- iOS has no beforeinstallprompt; install is Share > Add to Home Screen,
         and these three tags are what make it launch standalone with the right
         icon instead of opening in Safari. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent. It is meant to give a full-screen viewport, but
         on an installed app it handed us one that was screen height minus the
         status bar while still sitting at the top — so the bottom of the screen
         fell outside the web view and nothing could paint it. Measured on
         device: screen 956, viewport 894, inset-top 62.
         "default" lets iOS place the web view below the status bar and run it
         to the bottom, and it tints the bar from theme-color, which already
         tracks the active theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />

    <!--
      Apply the saved theme before first paint.

      iOS tints the status bar from theme-color and samples it at launch, long
      before React mounts and can update it. Left to the app, a light theme gets
      a dark band across the top of the screen that reads as a gap. Setting it
      here also removes the flash of the wrong theme on cold start.

      The colours below must match --theme-color in styles/themes.css. They're
      duplicated rather than read from CSS because the stylesheet is injected
      after this runs, so getComputedStyle would come back empty.
    -->
    <script>
      (function () {
        try {
          var THEME_COLORS = {
            midnight: '#07080b',
            daylight: '#faf9f7',
            aurora: '#4c1d95',
            terra: '#f6f1e8',
            golden: '#f7eedc',
          }
          var saved = JSON.parse(localStorage.getItem('jfj:settings') || '{}')
          var theme = THEME_COLORS[saved.theme] ? saved.theme : 'midnight'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', THEME_COLORS[theme])
        } catch (err) {
          /* first run, or storage unavailable — the default theme is fine */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
